<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f2f1ec" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141619" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>训练卡 · 五练</title>
<style>
  :root{
    --bg:#f2f1ec;
    --ink:#1c1e22;
    --muted:#6e727a;
    --line:rgba(0,0,0,.10);
    --glassRGB:255,255,255;
    --veilRGB:242,241,236;
    --glassA:.72;
    --veilA:.28;
    --glassBlur:16px;
    --bgblur:0px;
    --bgfit:cover;
    --zebra:rgba(0,0,0,.035);
    --main-bg:#1c1e22; --main-ink:#fff;
    --inputbg:rgba(255,255,255,.72);
    --ok:#189664; --good:#127a58;
    --a:#2f6fed; --b:#d85637; --c:#189664; --d:#7658e8;
    --tsh:0 1px 2px rgba(255,255,255,.85);
  }
  html[data-theme="dark"]{
    --bg:#141619;
    --ink:#eef0f4;
    --muted:#98a0ab;
    --line:rgba(255,255,255,.12);
    --glassRGB:30,34,40;
    --veilRGB:8,10,14;
    --zebra:rgba(255,255,255,.05);
    --main-bg:#eef0f4; --main-ink:#141619;
    --inputbg:rgba(255,255,255,.10);
    --ok:#22b57a; --good:#4ecb9b;
    --a:#5b8dff; --b:#ff7a55; --c:#22b57a; --d:#9a83ff;
    --tsh:0 1px 3px rgba(0,0,0,.62);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  html{background:var(--bg)}
  body{
    background:var(--bg); color:var(--ink); min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    font-size:17px; line-height:1.5; -webkit-text-size-adjust:100%;
  }

  /* 背景图：原图清晰铺满，虚化程度由滑块控制（默认 0） */
  body.hasbg{background:transparent}
  body.hasbg::before{
    content:""; position:fixed; inset:-2px; z-index:-2;
    background-image:var(--bgimg);
    background-position:center center;
    background-repeat:no-repeat;
    background-size:var(--bgfit);
    filter:blur(var(--bgblur));
  }
  body.hasbg::after{
    content:""; position:fixed; inset:0; z-index:-1;
    background:rgba(var(--veilRGB), var(--veilA));
  }

  .wrap{max-width:620px;margin:0 auto;padding:18px 16px 130px}

  /* 有背景图时，不在卡片里的文字给一层薄玻璃底，保证任何照片上都能读 */
  body.hasbg #home > h1,
  body.hasbg #home > .sub,
  body.hasbg #home > .tiny.muted,
  body.hasbg .exname,
  body.hasbg .meta{
    background:rgba(var(--glassRGB), calc(var(--glassA) * .62));
    -webkit-backdrop-filter:blur(10px) saturate(140%);
    backdrop-filter:blur(10px) saturate(140%);
    border-radius:12px; padding:3px 14px; margin-left:-14px;
    display:block; width:fit-content; text-shadow:var(--tsh);
  }
  body.hasbg .meta{display:inline-flex;padding:6px 14px;border-radius:999px;gap:12px}
  h1{font-size:26px;margin:0 0 4px}
  h2{font-size:20px;margin:0}
  .sub{color:var(--muted);font-size:14px}
  .row{display:flex;gap:10px;align-items:center}
  .grow{flex:1}
  .muted{color:var(--muted)}
  .small{font-size:14px}
  .tiny{font-size:12.5px}

  .glass{
    background:rgba(var(--glassRGB), var(--glassA));
    -webkit-backdrop-filter:blur(var(--glassBlur)) saturate(140%);
    backdrop-filter:blur(var(--glassBlur)) saturate(140%);
    border:1px solid var(--line);
  }

  .daycard{display:flex;align-items:stretch;margin-bottom:12px;border-radius:16px;overflow:hidden;cursor:pointer}
  .daycard .bar{width:8px;flex:0 0 8px}
  .daycard .body{padding:14px 16px;flex:1;min-width:0}
  .daycard .t{font-weight:700;font-size:19px;display:flex;justify-content:space-between;align-items:baseline;gap:10px}
  .daycard .cnt{font-size:14px;color:var(--muted);font-weight:400;white-space:nowrap}
  .pill{display:inline-block;font-size:12px;padding:3px 9px;border-radius:999px;
    background:rgba(47,111,237,.16);color:var(--a);margin-left:8px;vertical-align:middle}
  .pill-done{background:rgba(58,190,130,.18);color:#37c489}

  button{font:inherit;color:inherit;
    background:rgba(var(--glassRGB), calc(var(--glassA) * .78));
    border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-height:48px;cursor:pointer;
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px)}
  button:active{transform:scale(.985)}
  button:disabled{opacity:.4}
  .btn-main{background:var(--main-bg);color:var(--main-ink);border-color:transparent;font-weight:600;
    -webkit-backdrop-filter:none; backdrop-filter:none}
  .btn-soft{background:rgba(var(--glassRGB), calc(var(--glassA) * .6))}
  .btn-sm{padding:8px 12px;min-height:40px;font-size:15px;border-radius:10px}

  .resume{margin-bottom:14px;border-radius:16px;padding:14px 16px;display:flex;gap:12px;
    align-items:center;border-color:rgba(47,111,237,.35)}
  .resume .t{font-weight:700}

  .top{position:sticky;top:0;z-index:5;padding:10px 0 8px;background:var(--bg);border-bottom:1px solid var(--line)}
  body.hasbg .top{background:rgba(var(--glassRGB), var(--glassA));
    -webkit-backdrop-filter:blur(var(--glassBlur)) saturate(140%);
    backdrop-filter:blur(var(--glassBlur)) saturate(140%)}
  .bar-outer{height:6px;background:var(--zebra);border-radius:99px;overflow:hidden;margin-top:8px}
  .bar-inner{height:100%;width:0;transition:width .25s;background:var(--a)}
  .exname{font-size:26px;font-weight:800;letter-spacing:.5px;margin:2px 0 6px}
  .meta{display:flex;gap:14px;flex-wrap:wrap;font-size:15px;color:var(--muted);align-items:center}
  .dot{width:4px;height:4px;border-radius:99px;background:var(--muted);display:inline-block;opacity:.5}

  .cuebox{border-radius:16px;padding:14px 16px;margin:14px 0}
  .cuebox .lbl{font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--muted);margin-bottom:6px}
  .cue{font-size:17px;line-height:1.65}
  .tell{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);
    color:var(--good);font-size:16px;line-height:1.6}

  .sets{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;margin:14px 0 6px}
  .setbtn{min-height:64px;font-size:16px;font-weight:600;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:2px;transition:opacity .15s}
  .setbtn.on{background:var(--ok);border-color:transparent;color:#fff;
    -webkit-backdrop-filter:none; backdrop-filter:none}
  .setbtn .n{font-size:13px;font-weight:400;opacity:.75}
  body.resting .setbtn:not(.on){opacity:.35}

  .weightrow{display:flex;gap:10px;align-items:center;margin:12px 0 4px;flex-wrap:wrap}
  .weightrow input{font:inherit;width:130px;padding:11px 12px;border:1px solid var(--line);
    border-radius:12px;background:var(--inputbg);color:var(--ink);text-align:center}
  .nav{display:flex;gap:10px;margin-top:18px}
  .nav button{flex:1;min-height:56px}
  .nav .nx{font-size:15.5px;line-height:1.3;padding:10px}
  .vlink{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:var(--a);
    text-decoration:none;border:1px solid rgba(47,111,237,.3);background:rgba(47,111,237,.12);
    padding:9px 13px;border-radius:99px}
  /* 有背景图时，演示链接和重量行也垫一层，别让照片把字吃掉 */
  body.hasbg .vlink{background:rgba(var(--glassRGB), calc(var(--glassA) * .78));
    border-color:rgba(var(--glassRGB), calc(var(--glassA) * .9));
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
  body.hasbg .weightrow{background:rgba(var(--glassRGB), calc(var(--glassA) * .62));
    -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
    border-radius:16px;padding:8px 14px;width:fit-content}

  #restbar{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;
    background:rgba(16,18,22,.94);color:#fff;padding:12px 16px calc(12px + env(safe-area-inset-bottom));
    border-radius:20px 20px 0 0;box-shadow:0 -10px 30px rgba(0,0,0,.28);
    -webkit-backdrop-filter:blur(18px); backdrop-filter:blur(18px)}
  #restbar.on{display:block}
  html[data-theme="dark"] #restbar{background:rgba(36,40,47,.96);border-top:1px solid rgba(255,255,255,.08)}
  #restbar .r{display:flex;align-items:center;gap:12px}
  #rtime{font-size:40px;font-weight:800;font-variant-numeric:tabular-nums;min-width:118px}
  #rlabel{font-size:12.5px;opacity:.7}
  #restbar button{background:rgba(255,255,255,.13);border-color:rgba(255,255,255,.18);color:#fff;
    min-height:44px;padding:8px 12px;font-size:15px}

  /* 设置面板 */
  #sheet{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.32)}
  #sheet.on{display:block}
  .sheet-inner{position:absolute;left:0;right:0;bottom:0;border-radius:22px 22px 0 0;
    padding:18px 18px calc(20px + env(safe-area-inset-bottom));
    background:rgba(var(--glassRGB), calc(var(--glassA) + .1));
    -webkit-backdrop-filter:blur(24px) saturate(150%);
    backdrop-filter:blur(24px) saturate(150%);
    border-top:1px solid var(--line);max-height:88vh;overflow:auto}
  .sheet-inner h3{margin:0 0 4px;font-size:19px}
  .seg{display:flex;gap:8px;margin:10px 0 14px}
  .seg button{flex:1;min-height:44px;font-size:15px}
  .seg button.act{background:var(--main-bg);color:var(--main-ink);border-color:transparent}
  .divider{height:1px;background:var(--line);margin:14px 0}
  .sl{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 2px}
  .sl .v{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  input[type=range]{width:100%;height:34px;accent-color:var(--a);background:transparent;margin:0}

  .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:100px;background:rgba(16,18,22,.94);
    color:#fff;padding:11px 18px;border-radius:99px;font-size:15px;opacity:0;transition:opacity .2s;
    pointer-events:none;z-index:60;max-width:88vw;text-align:center}
  .toast.on{opacity:.96}

  }
  .ink{font-family:"Ink","STXingkai","华文行楷","STKaiti","KaiTi","楷体",serif;
    color:#111; -webkit-font-smoothing:antialiased}

  /* ============ 开屏：竖排书法 ============ */
  #splash{
    position:fixed; inset:0; z-index:80; background:#fbfaf6;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    transform-origin:left center; perspective:1800px;
    transition:transform .9s cubic-bezier(.55,.02,.28,1), opacity .9s ease;
    -webkit-tap-highlight-color:transparent;
  }
  #splash::after{ /* 翻页时的阴影 */
    content:""; position:absolute; inset:0; pointer-events:none; opacity:0;
    background:linear-gradient(to left, rgba(0,0,0,.35), rgba(0,0,0,0) 32%);
    transition:opacity .9s ease;
  }
  #splash.turn{transform:rotateY(-102deg) translateX(-8%) scale(.99); opacity:.2; pointer-events:none}
  #splash.turn::after{opacity:1}

  .splash-stage{position:relative; display:flex; align-items:flex-start; gap:22px}
  .vert{
    writing-mode:vertical-rl; text-orientation:upright;
    font-size:clamp(112px, 27vw, 210px); line-height:1.02; letter-spacing:.02em;
    font-weight:400; color:#0d0d0d;
    filter:url(#inkedge);
    -webkit-mask-image:linear-gradient(to bottom, #000 0%, #000 62%, rgba(0,0,0,.72) 88%, rgba(0,0,0,.9) 100%);
    mask-image:linear-gradient(to bottom, #000 0%, #000 62%, rgba(0,0,0,.72) 88%, rgba(0,0,0,.9) 100%);
  }
  .seal{
    position:relative;
    align-self:flex-end; width:88px; height:88px; flex:0 0 88px;
    background:#b4242b; color:#fbfaf6; border-radius:3px; transform:rotate(-3.5deg);
    display:grid; grid-template-columns:1fr 1fr; align-content:center; justify-items:center;
    font-family:"Ink","STKaiti","KaiTi",serif; font-size:27px; line-height:1.08;
    box-shadow:0 3px 12px rgba(150,20,25,.30); filter:url(#inkedge);
    padding:9px 4px; margin-bottom:16px;
  }
  .seal::before{
    content:""; position:absolute; inset:4px; border:2px solid rgba(251,250,246,.82);
    border-radius:2px; pointer-events:none;
  }
  .seal span{display:block}
  .splash-foot{margin-top:34px; display:flex; flex-direction:column; align-items:center; gap:8px}
  .pinyin{font-family:-apple-system,"Helvetica Neue",Arial,sans-serif;
    font-size:14px; letter-spacing:.55em; text-indent:.55em; color:#5b5b57; font-weight:600}
  .splash-tip{position:absolute; bottom:calc(30px + env(safe-area-inset-bottom));
    font-size:13px; color:#8b8b84; letter-spacing:.18em; animation:bob 2.2s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0); opacity:.65}50%{transform:translateY(-6px); opacity:1}}

  /* ============ 页头书法小句 ============ */
  .hdr{padding:16px 2px 4px}
  .hdr .q{font-family:"Ink","STXingkai","STKaiti","KaiTi",serif;
    font-size:17px; line-height:1.5; color:var(--ink); letter-spacing:.06em}
  .hdr .q .em{color:#b4242b}

  /* ============ 底部四栏 ============ */
  #tabbar{
    position:fixed; left:0; right:0; bottom:0; z-index:30; display:flex;
    padding:6px 6px calc(6px + env(safe-area-inset-bottom));
    background:rgba(var(--glassRGB), calc(var(--glassA) + .06));
    -webkit-backdrop-filter:blur(var(--glassBlur)) saturate(150%);
    backdrop-filter:blur(var(--glassBlur)) saturate(150%);
    border-top:1px solid var(--line);
  }
  #tabbar button{
    flex:1; background:none; border:0; min-height:50px; padding:5px 0 3px;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    font-size:11.5px; color:var(--muted); -webkit-backdrop-filter:none; backdrop-filter:none;
  }
  #tabbar button.act{color:var(--ink); font-weight:700}
  #tabbar svg{width:21px; height:21px; fill:none; stroke:currentColor; stroke-width:1.7;
    stroke-linecap:round; stroke-linejoin:round}
  body.in-session #tabbar, body.in-session .hdr{display:none}
  body.in-session .wrap{padding-bottom:150px}

  /* ============ 训练记录 · 日历 ============ */
  .calhead{display:flex; align-items:center; gap:10px; margin:14px 0 10px}
  .calhead .m{font-size:18px; font-weight:700; font-variant-numeric:tabular-nums}
  .calgrid{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
  .calgrid .wd{font-size:11.5px; color:var(--muted); text-align:center; padding-bottom:2px}
  .calcell{position:relative; aspect-ratio:1/1; border-radius:9px; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    font-size:13px; color:var(--muted); background:var(--zebra); border:1px solid transparent}
  .calcell.empty{background:none}
  .calcell.has{color:var(--ink); font-weight:700}
  .calcell.today{border-color:var(--ink)}
  .calcell .dm{font-size:9.5px; line-height:1; margin-top:2px; opacity:.85}
  .calcell.sel{outline:2px solid var(--a); outline-offset:-2px}
  .legend{display:flex; gap:12px; align-items:center; margin:12px 0 0; font-size:12px; color:var(--muted)}
  .legend i{width:11px; height:11px; border-radius:3px; display:inline-block; margin-right:4px}
  .calday{margin-top:14px}

  /* ============ 训练照片 ============ */
  .phsec{margin-top:12px; padding-top:12px; border-top:1px dashed var(--line)}
  .phtop{display:flex; align-items:center; justify-content:space-between; margin-bottom:8px}
  .phgrid{display:grid; grid-template-columns:repeat(4, 1fr); gap:8px}
  .phitem{position:relative; aspect-ratio:1/1; border-radius:10px; overflow:hidden;
    background:rgba(127,127,127,.14); cursor:pointer}
  .phitem img{width:100%; height:100%; object-fit:cover; display:block}
  .phempty{grid-column:1/-1; font-size:13px; color:var(--muted); padding:6px 2px}
  .phbtns{display:flex; gap:8px; margin-top:10px}
  .phtip{margin-top:7px; line-height:1.55}
  .backrow{display:flex; flex-wrap:wrap; gap:8px; margin-top:8px}

  #photoView{position:fixed; inset:0; z-index:90; display:none; flex-direction:column;
    background:rgba(6,7,9,.985); color:#fff}
  #photoView.on{display:flex}
  #photoView .pbar{display:flex; align-items:center; gap:10px;
    padding:calc(10px + env(safe-area-inset-top)) 14px 6px; font-size:13px; color:rgba(255,255,255,.75)}
  #photoView .pbar .grow{flex:1}
  #photoView .pbody{flex:1; display:flex; align-items:center; justify-content:center; padding:6px 10px; overflow:hidden}
  #photoView img{max-width:100%; max-height:100%; object-fit:contain; border-radius:8px}
  #photoView .pnav{display:flex; gap:10px; justify-content:center; padding:12px 0 10px}
  #photoView button{font:inherit; font-size:14px; color:#fff; border-radius:12px; min-height:44px;
    padding:0 16px; border:1px solid rgba(255,255,255,.22); background:rgba(255,255,255,.12)}
  #photoView button:disabled{opacity:.35}
  #photoView button.danger{color:#ffb4a8; border-color:rgba(255,120,90,.45)}
  #photoView .ptip{text-align:center; font-size:12px; color:rgba(255,255,255,.5);
    padding:0 20px calc(14px + env(safe-area-inset-bottom))}

  /* ============ 心得 ============ */
  .notebox{width:100%; min-height:150px; padding:14px; border-radius:16px; font:inherit;
    line-height:1.65; color:var(--ink); border:1px solid var(--line);
    background:rgba(var(--glassRGB), calc(var(--glassA) * .8)); resize:vertical}
  .notebox:focus{outline:2px solid rgba(47,111,237,.45); outline-offset:1px}
  .noterow{padding:13px 15px; border-radius:14px; margin-top:10px; cursor:pointer}
  .noterow .d{font-size:12.5px; color:var(--muted); margin-bottom:3px}
  .noterow .x{font-size:15px; line-height:1.5; display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden}

  /* ============ 设置列表 ============ */
  .setlist{margin-top:12px; border-radius:16px; overflow:hidden}
  .setrow{display:flex; align-items:center; gap:12px; padding:15px 16px; cursor:pointer;
    border-bottom:1px solid var(--line)}
  .setrow:last-child{border-bottom:0}
  .setrow .k{flex:1; font-size:16px}
  .setrow .v{font-size:14px; color:var(--muted)}
  .setrow .ar{color:var(--muted); font-size:16px}
</style>
</head>

<div id="photoView">
  <div class="pbar">
    <div id="pvbar">1 / 1</div>
    <div class="grow"></div>
    <button data-pvdel="1" class="danger">删除</button>
    <button data-pvclose="1">关闭</button>
  </div>
  <div class="pbody"><img id="pvimg" alt=""></div>
  <div class="pnav">
    <button id="pvprev">上一张</button>
    <button id="pvnext">下一张</button>
  </div>
  <div class="ptip">长按照片可以「存储到照片」，相册里也存一份</div>
</div>

<div id="sheet">
  <div class="sheet-inner">
    <h3>外观</h3>
    <div class="sub">拖动即时生效，存在这台手机上</div>
    <div class="divider"></div>

    <div class="small muted">主题</div>
    <div class="seg" id="seg-theme">
      <button data-th="auto">跟随系统</button>
      <button data-th="light">浅色</button>
      <button data-th="dark">深色</button>
    </div>

    <div class="small muted">背景图</div>
    <div class="seg">
      <button id="btn-bg" class="btn-soft">选择图片</button>
      <button id="btn-bgclear" class="btn-soft">清除背景</button>
    </div>
    <div class="seg" id="seg-fit">
      <button data-fit="cover">铺满屏幕</button>
      <button data-fit="contain">看完整张</button>
    </div>

    <div class="divider"></div>

    <div class="sl"><span class="small">背景虚化</span><span class="v" id="v-bgblur">0 px</span></div>
    <input type="range" id="r-bgblur" min="0" max="30" step="1">

    <div class="sl"><span class="small">背景压暗</span><span class="v" id="v-veil">28 %</span></div>
    <input type="range" id="r-veil" min="0" max="70" step="2">

    <div class="sl"><span class="small">卡片不透明</span><span class="v" id="v-glass">72 %</span></div>
    <input type="range" id="r-glass" min="20" max="96" step="2">

    <div class="sl"><span class="small">卡片磨砂</span><span class="v" id="v-gblur">16 px</span></div>
    <input type="range" id="r-gblur" min="0" max="30" step="1">

    <div class="divider"></div>
    <button id="btn-sheet-done" class="btn-main" style="width:100%">好了</button>
    <input type="file" id="filebg" accept="image/*" style="display:none">
  </div>
</div>

var ORDER = ["A","B","C","D","E","L"];
/* 练的顺序（不是「星期几练哪块」）：A 推 → B 蹲 → 轻 → C 拉 → D 后链 → E 肩臂 → 轻，一轮 7 天，5 硬 + 2 轻。
   卡片上的「周一/周四」只是参考；排期只认这个顺序和「新一套」的记录，
   免得换了计划、周中才开始，一上来就被推到半截去。 */
var CYCLE = ["A","B","L","C","D","E","L"];

/* ================= 存储 ================= */
var LS_LOAD="sm_loads_v1", LS_HIS="sm_his_v1", LS_CFG="sm_cfg_v1", LS_SESS="sm_sess_v1", LS_NOTE="sm_notes_v1", LS_CYC="sm_cyc_v1";
function rd(k,d){ try{ var v=localStorage.getItem(k); return v?JSON.parse(v):d; }catch(e){ return d; } }
function wr(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); return true; }catch(e){ return false; } }

var DEF = { mode:"down", theme:"auto", bg:"", bgBlur:0, veil:0.28, glassA:0.72, glassBlur:16, fit:"cover" };
var VER = "v5.16 · 2026-11-26";
var cfg = rd(LS_CFG, {});
for(var k in DEF){ if(cfg[k]===undefined) cfg[k]=DEF[k]; }
var loads = rd(LS_LOAD, {});
/* 一次性迁移：保加利亚蹲改成每手 10 kg，把旧的"自重 / 5"覆盖掉（只动这一项） */
(function(){
  var old = loads.bss;
  if(old === undefined || old === null) return;
  var s = String(old).replace(/\s/g, "");
  if(s === "" || s === "自重" || s === "5" || s === "0" || s === "空手" || s === "5kg"){
    loads.bss = "10/手";
    wr(LS_LOAD, loads);
  }
})();
var his = rd(LS_HIS, []);
/* 顺序游标：下一个该练 CYCLE 里的第几个。0 = A，新装 / 清空后从这里开始 */
var cyc = rd(LS_CYC, 0);
if(typeof cyc !== "number" || cyc < 0 || cyc >= CYCLE.length) cyc = 0;
var notes = rd(LS_NOTE, {});

/* 这台浏览器到底能不能存数据（用 file:// 打开时，有的浏览器会直接禁掉 localStorage） */
var stOK = (function(){
  try{
    var k = "__sm_chk_" + Date.now();
    localStorage.setItem(k, "1");
    var ok = localStorage.getItem(k) === "1";
    localStorage.removeItem(k);
    return ok;
  }catch(e){ return false; }
})();

/* ================= 工具 ================= */
function $(s,r){ return (r||document).querySelector(s); }
function totalSets(day){ return PLAN[day].items.reduce(function(a,x){ return a+x.sets; },0); }
function mainSets(day){ return PLAN[day].items.reduce(function(a,x){ return a + (x.core?0:x.sets); },0); }
function todayStr(){ var d=new Date(); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); }
function fmt(s){ s=Math.max(0,s|0); var m=Math.floor(s/60), r=s%60; return m+":"+(r<10?"0":"")+r; }
function toast(msg){
  var t=$("#toast"); t.textContent=msg; t.className="toast on";
  clearTimeout(t._h); t._h=setTimeout(function(){ t.className="toast"; },1800);
}
function beep(times){
  try{
    var AC = window.AudioContext||window.webkitAudioContext; if(!AC) return;
    if(!beep._ac) beep._ac = new AC();
    var ac = beep._ac; if(ac.state==="suspended") ac.resume();
    var t0 = ac.currentTime;
    for(var k=0;k<(times||2);k++){
      var o=ac.createOscillator(), g=ac.createGain();
      o.type="sine"; o.frequency.setValueAtTime(880, t0+k*0.45);
      g.gain.setValueAtTime(0.0001, t0+k*0.45);
      g.gain.exponentialRampToValueAtTime(0.3, t0+k*0.45+0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0+k*0.45+0.32);
      o.connect(g); g.connect(ac.destination);
      o.start(t0+k*0.45); o.stop(t0+k*0.45+0.34);
    }
  }catch(e){}
}
function buzz(){ if(navigator.vibrate){ try{ navigator.vibrate([120,60,120]); }catch(e){} } }

/* ================= 外观 ================= */
function applyTheme(){
  var t = cfg.theme;
  if(t==="auto"){
    var dark = false;
    try{ dark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; }catch(e){}
    t = dark ? "dark" : "light";
  }
  document.documentElement.setAttribute("data-theme", t);
  var meta = document.querySelector('meta[name="theme-color"]');
  if(meta) meta.setAttribute("content", t==="dark" ? "#141619" : "#f2f1ec");
}
function applyLook(){
  var r = document.documentElement.style;
  r.setProperty("--bgblur", cfg.bgBlur + "px");
  r.setProperty("--veilA", cfg.veil);
  r.setProperty("--glassA", cfg.glassA);
  r.setProperty("--glassBlur", cfg.glassBlur + "px");
  r.setProperty("--bgfit", cfg.fit === "contain" ? "contain" : "cover");
  if(cfg.bg){
    document.body.classList.add("hasbg");
    document.body.style.setProperty("--bgimg", 'url("' + cfg.bg + '")');
    /* 同一张图再铺一层在 html 上：万一某些浏览器/滚动容器让 fixed 层对不齐，也不会露出底色 */
    var h = document.documentElement.style;
    h.backgroundImage = 'url("' + cfg.bg + '")';
    h.backgroundSize = cfg.fit === "contain" ? "contain" : "cover";
    h.backgroundPosition = "center center";
    h.backgroundRepeat = "no-repeat";
    h.backgroundAttachment = "fixed";
  } else {
    document.body.classList.remove("hasbg");
    document.body.style.removeProperty("--bgimg");
    var h2 = document.documentElement.style;
    h2.backgroundImage = "";

/* ================= 休息计时 ================= */
var T = { on:false, mode:"down", left:0, up:0, id:null };
function openRest(sec){
  if(sec<=0) return;
  T.on=true; T.mode=cfg.mode; T.left=sec|0; T.up=0;
  $("#restbar").className="on";
  document.body.classList.add("resting");
  paintRest();
  if(T.id) clearInterval(T.id);
  T.id=setInterval(function(){
    if(T.mode==="down"){
      T.left--;
      if(T.left<=0){ closeRest(); beep(2); buzz(); return; }
    } else { T.up++; }
    paintRest();
  },1000);
  if(S.day) renderSession(true);
}
function paintRest(){
  if(!T.on) return;
  $("#rtime").textContent = (T.mode==="down") ? fmt(T.left) : fmt(T.up);
  $("#rlabel").textContent = (T.mode==="down") ? "休息倒计时 · 组按钮已锁" : "已休息（正计时）· 组按钮已锁";
}
function closeRest(){
  T.on=false; if(T.id){ clearInterval(T.id); T.id=null; }
  $("#restbar").className="";
  document.body.classList.remove("resting");
  if(S.day) renderSession(true);
}
$("#restbar").addEventListener("click", function(e){
  var b=e.target.closest("[data-r]"); if(!b) return;
  var a=b.getAttribute("data-r");
  if(a==="skip"){ closeRest(); }
  else if(a==="add"){ if(T.mode==="down") T.left+=15; else T.up-=15; paintRest(); }
  else if(a==="sub"){
    if(T.mode==="down"){ T.left=Math.max(0,T.left-15); if(T.left===0){ closeRest(); beep(2); buzz(); } }
    else T.up=Math.max(0,T.up-15);
    paintRest();
  }
});

/* ================= 唤醒锁 ================= */
var wl=null;
function keepAwake(){
  try{
    if("wakeLock" in navigator && !wl){
      navigator.wakeLock.request("screen").then(function(s){
        wl=s; s.addEventListener("release", function(){ wl=null; });
      }).catch(function(){});
    }
  }catch(e){}
}
function dropAwake(){ try{ if(wl){ wl.release(); wl=null; } }catch(e){} }

/* ================= 会话 ================= */
var S = { day:null, i:0, done:{}, date:null };

function saveSess(){
  if(!S.day){ try{ localStorage.removeItem(LS_SESS); }catch(e){} return; }
  wr(LS_SESS, { day:S.day, i:S.i, done:S.done, date:S.date, ts:Date.now() });
}
function readSess(){
  var s = rd(LS_SESS, null);
  if(!s || !s.day || !PLAN[s.day]) return null;
  if(Date.now() - (s.ts||0) > 1000*60*60*24*3) return null;
  return s;
}
function clearSess(){ try{ localStorage.removeItem(LS_SESS); }catch(e){} }
function ago(ts){
  var m = Math.round((Date.now()-ts)/60000);
  if(m < 1) return "刚刚";
  if(m < 60) return m + " 分钟前";
  var h = Math.round(m/60);
  if(h < 24) return h + " 小时前";
  return Math.round(h/24) + " 天前";
}
function startSession(day, restore, date){
  var s = restore || null;
  S.day = day;
  S.i = s ? Math.min(s.i||0, PLAN[day].items.length-1) : 0;
  S.done = s ? (s.done||{}) : {};
  S.date = (s && s.date) || date || todayStr();
  keepAwake(); saveSess(); renderSession();
}
function curItems(){ return PLAN[S.day].items; }
function dayDoneSets(){
  var n=0;
  curItems().forEach(function(it){ n += Math.min(S.done[it.id]||0, it.sets); });
  return n;
}

  return Object.keys(m).length;
}
function lastOf(day){
  for(var i=his.length-1;i>=0;i--){ if(recDay(his[i])===day) return his[i]; }
  return null;
}

/* 轮转备用：A→B→C→D→E 循环（轻日不参与） */
function nextOf(day){
  var order = ["A","B","C","D","E"];
  var i = order.indexOf(day);
  if(i < 0) return "A";                 /* L（有氧）或认不出的日子 → 回到 A */
  return order[(i+1) % order.length];
}
/* 日志日期是不补零的（2026-11-9），直接按字符串比大小会错，
   统一压成 YYYYMMDD 再比 */
function dateKey(d){
  var p = String(d || "").split("-");
  return (parseInt(p[0],10)||0)*10000 + (parseInt(p[1],10)||0)*100 + (parseInt(p[2],10)||0);
}
/* 换成 v5.9 之后，之前练的都算「上一套」：记录一条不删，
   历史、日历、重量全留着，但排期和「新一套已练」从新一套重新算。
   另外旧计划里的 D 是「肩 + 手臂」，对应新计划的 E，标签和排期都按 E 认。 */
var GEN = "2026-11-19";
function recDay(h){
  if(!h || !h.day) return "";
  return (h.day === "D" && dateKey(h.date) < dateKey(GEN)) ? "E" : h.day;
}
function newHis(){
  var g = dateKey(GEN);
  return his.filter(function(h){ return h && h.date && dateKey(h.date) >= g; });
}
/* 最近一次完成的训练（按日期，其次按时刻） */
function latestHis(){
  var best = null, bk = -1, bt = -1;
  his.forEach(function(h){
    if(!h || !h.date) return;
    var k = dateKey(h.date), t = h.ts || 0;
    if(k > bk || (k === bk && t >= bt)){ best = h; bk = k; bt = t; }
  });
  return best;
}
/* 今天已经练过的日子：{A:true, C:true}（只认新一套） */
function todayDone(){
  var t = todayStr(), m = {};
  newHis().forEach(function(h){ if(h && h.date === t) m[recDay(h)] = true; });
  return m;
}
/* 排期：按 CYCLE 顺序走，游标记着下一个该练哪个；新一套还没开张时一律从 A 开始。
   跳过某个不练也没关系——练了哪一个，游标就挪到它的下一个。
   想临时换顺序，直接点下面那张卡片。 */
function suggestDay(){
  var td = todayDone();
  var last = latestHis();
  var i = newHis().length ? cyc : 0;   /* 新一套还是空的：第一练就是 A */
  var pick = CYCLE[i], step = 0;
  while(td[pick] && step < CYCLE.length){ step++; pick = CYCLE[(i + step) % CYCLE.length]; }
  return { day: pick, doneToday: td, last: last };
}
/* 练完一个，游标挪到它的下一个（从当前位置往后找第一次出现） */
function cycNext(day){
  for(var o = 0; o < CYCLE.length; o++){
    if(CYCLE[(cyc + o) % CYCLE.length] === day){
      cyc = (cyc + o + 1) % CYCLE.length;
      wr(LS_CYC, cyc);
      return;
    }
  }
}

/* ---- 第 2 栏：训练记录 · 日历 ---- */
function calMap(){
  var map = {};
  his.forEach(function(h){
    var k = h.date;
    if(!map[k]) map[k] = { n:0, sets:0, letters:[], items:[] };
    map[k].n++; map[k].sets += (h.sets||0);
    map[k].letters.push(recDay(h));
    map[k].items.push(h);
  });
  return map;
}
function renderCalendar(){
  if(!CAL){ var n0=new Date(); CAL = { y:n0.getFullYear(), m:n0.getMonth()+1 }; }
  var map = calMap();
  var days = new Date(CAL.y, CAL.m, 0).getDate();
  var startW = (new Date(CAL.y, CAL.m-1, 1).getDay() + 6) % 7;  // 周一算第一列
  var today = todayStr();

  var mDays=0, mSets=0;
  for(var d=1; d<=days; d++){
    var kk = keyOf(CAL.y, CAL.m, d);
    if(map[kk]){ mDays++; mSets += map[kk].sets; }
  }

  var h = '';
  h += '<div class="calhead">'
     +   '<button class="btn-sm btn-soft" data-mv="-1">‹</button>'

     +   '<button class="btn-sm btn-soft" data-mv="0">今天</button>'
     + '</div>';
  h += '<div class="sub" style="margin:0 0 12px">这个月练了 <b>'+mDays+'</b> 天 · 共 <b>'+mSets+'</b> 组'
     + (mDays===0 ? ' · 还没开张' : '') + '</div>';

  h += '<div class="calgrid">';
  ["一","二","三","四","五","六","日"].forEach(function(w){ h += '<div class="wd">'+w+'</div>'; });
  for(var i=0; i<startW; i++) h += '<div class="calcell empty"></div>';
  for(var d2=1; d2<=days; d2++){
    var k2 = keyOf(CAL.y, CAL.m, d2), it = map[k2];
    var cls = 'calcell' + (it?' has':'') + (k2===today?' today':'') + (k2===SELKEY?' sel':'');
    var st = '';

    }
    if(notes[SELKEY]){
      h += '<div class="small" style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);line-height:1.65">'
         + '心得：'+esc(notes[SELKEY])+'</div>';

       +   '<div class="phgrid" id="phgrid"></div>'

       +     '<button class="btn-sm btn-main" data-pick="1">从相册选</button>'

       + '</div>';

       +   '<div class="tiny muted">补录：这天练的是哪一块？点一下就进去记（完成记到这天）</div>'
       +   '<div class="backrow">'
       +     ORDER.slice(0,5).map(function(k){
               return '<button class="btn-sm btn-soft" data-back="'+k+'">'+PLAN[k].name+'</button>';
             }).join("")
       +   '</div>'

      else {
        CAL.m += v;

        if(CAL.m > 12){ CAL.m = 1; CAL.y++; }

    var c = e.target.closest("[data-day]");

    var ph = e.target.closest("[data-pid]");
    if(ph){ openViewer(SELKEY, ph.getAttribute("data-pid")); return; }
  };
  if(SELKEY) paintPhotos(SELKEY);
}

/* ---- 训练照片（IndexedDB，一天最多 5 张） ---- */

function openDB(){
  if(PDB) return Promise.resolve(PDB);
  return new Promise(function(res, rej){
    if(!window.indexedDB) return rej(new Error("no idb"));
    var r = indexedDB.open("sm_photos", 1);
    r.onupgradeneeded = function(e){
      var db = e.target.result;
      if(!db.objectStoreNames.contains("ph")){
        var st = db.createObjectStore("ph", { keyPath:"id" });
        st.createIndex("date", "date", { unique:false });
      }
    };
    r.onsuccess = function(){ PDB = r.result; res(PDB); };
    r.onerror = function(){ rej(r.error || new Error("idb")); };
  });
}
function phAll(){
  return openDB().then(function(db){
    return new Promise(function(res, rej){
      var q = db.transaction("ph").objectStore("ph").getAll();
      q.onsuccess = function(){ res(q.result || []); };
      q.onerror = function(){ rej(q.error); };
    });
  });
}
function phByDate(d){
  return phAll().then(function(a){
    return a.filter(function(x){ return x.date === d; }).sort(function(x,y){ return x.ts - y.ts; });
  });
}
function phPut(rec){
  return openDB().then(function(db){
    return new Promise(function(res, rej){
      var t = db.transaction("ph", "readwrite");
      t.objectStore("ph").put(rec);
      t.oncomplete = function(){ res(); };
      t.onerror = function(){ rej(t.error || new Error("put")); };
      t.onabort = function(){ rej(t.error || new Error("abort")); };
    });
  });
}
function phDel(id){
  return openDB().then(function(db){
    return new Promise(function(res, rej){
      var t = db.transaction("ph", "readwrite");
      t.objectStore("ph").delete(id);
      t.oncomplete = function(){ res(); };
      t.onerror = function(){ rej(t.error); };
    });
  });
}
function phClear(){
  return openDB().then(function(db){
    return new Promise(function(res, rej){
      var t = db.transaction("ph", "readwrite");
      t.objectStore("ph").clear();
      t.oncomplete = function(){ res(); };
      t.onerror = function(){ rej(t.error); };
    });
  });
}
function phStats(){
  return phAll().then(function(a){
    var bytes = 0;
    a.forEach(function(p){ bytes += (p.size || (p.full && p.full.size) || 0); });
    return { n:a.length, bytes: bytes, mb: bytes / 1048576 };
  });
}
function fmtSize(bytes){
  if(bytes >= 1048576) return (bytes/1048576).toFixed(1) + " MB";
  if(bytes >= 1024) return Math.round(bytes/1024) + " KB";
  return bytes + " B";
}

/* 压到长边 edge，画布重绘顺带把 EXIF 方向摆正 */
function phCompress(file, edge, q){
  return new Promise(function(res, rej){
    var url = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function(){
      try{
        var w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
        var s = Math.min(1, edge / Math.max(w, h));
        var cw = Math.max(1, Math.round(w * s)), ch = Math.max(1, Math.round(h * s));
        var c = document.createElement("canvas");
        c.width = cw; c.height = ch;
        c.getContext("2d").drawImage(img, 0, 0, cw, ch);
        c.toBlob(function(b){
          URL.revokeObjectURL(url);
          if(b) res({ blob:b, w:cw, h:ch });
          else rej(new Error("toBlob"));
        }, "image/jpeg", q);
      }catch(err){ URL.revokeObjectURL(url); rej(err); }
    };
    img.onerror = function(){ URL.revokeObjectURL(url); rej(new Error("decode")); };
    img.src = url;
  });
}

function addPhotos(date, files){
  var arr = Array.prototype.slice.call(files || []).filter(function(f){
    return f && (!f.type || /^image\//.test(f.type));
  });
  if(!arr.length){ toast("没有选到图片"); return Promise.resolve(); }
  return phByDate(date).then(function(list){
    var left = PH_MAX - list.length;
    if(left <= 0){ toast("这天已经 "+PH_MAX+" 张了，先在照片里删一张"); return; }
    var take = arr.slice(0, left);
    if(arr.length > left) toast("只存前 "+left+" 张（一天上限 "+PH_MAX+"）");
    else toast("正在处理 "+take.length+" 张…");
    return take.reduce(function(p, f){
      return p.then(function(){
        return phCompress(f, PH_EDGE, PH_Q).then(function(big){
          return phCompress(f, PH_TEDGE, PH_TQ).then(function(sm){
            return phPut({
              id: date + "_" + Date.now() + "_" + Math.random().toString(36).slice(2, 7),
              date: date, ts: Date.now(), w: big.w, h: big.h, size: big.blob.size,
              full: big.blob, thumb: sm.blob
            });
          });
        });
      });
    }, Promise.resolve()).then(function(){
      paintPhotos(date);
      toast("照片已存");
    });
  }).catch(function(err){
    console.error(err);
    toast("照片存不进去（存储可能满了）");
  });
}

function phInput(date, multiple, capture){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = "image/*";
  if(multiple) inp.multiple = true;
  if(capture) inp.capture = "environment";
  inp.style.cssText = "position:fixed;left:-9999px;top:0;opacity:0";
  document.body.appendChild(inp);
  inp.onchange = function(){
    var fs = inp.files;
    addPhotos(date, fs).then(function(){ inp.remove(); }, function(){ inp.remove(); });
  };
  setTimeout(function(){ try{ inp.remove(); }catch(e){} }, 120000);
  inp.click();
}
function pickPhotos(date){ if(date) phInput(date, true, false); }
function snapPhoto(date){ if(date) phInput(date, false, true); }

function revokePh(){
  PH_URLS.forEach(function(u){ try{ URL.revokeObjectURL(u); }catch(e){} });
  PH_URLS = [];
}
function paintPhotos(date){
  if(!document.getElementById("phgrid")) return;
  var c0 = document.getElementById("phcnt");
  var done = false;
  var guard = setTimeout(function(){
    if(done) return;
    done = true;
    var c = document.getElementById("phcnt");
    if(c) c.textContent = "这台浏览器存不了照片";
  }, 4000);
  phByDate(date).then(function(list){
    done = true; clearTimeout(guard);
    var g = document.getElementById("phgrid"); if(!g) return;
    var c = document.getElementById("phcnt");
    if(c) c.textContent = list.length + " / " + PH_MAX + " 张";
    revokePh();
    g.innerHTML = "";
    if(!list.length){
      var e = document.createElement("div");
      e.className = "phempty";
      e.textContent = "这天还没照片";
      g.appendChild(e);
      return;
    }
    list.forEach(function(p){
      var d = document.createElement("div");
      d.className = "phitem"; d.setAttribute("data-pid", p.id);
      var im = document.createElement("img");
      var u = URL.createObjectURL(p.thumb || p.full);
      PH_URLS.push(u);
      im.src = u; im.loading = "lazy"; im.alt = date;
      d.appendChild(im); g.appendChild(d);
    });
  }).catch(function(){
    done = true; clearTimeout(guard);
    var c = document.getElementById("phcnt");
    if(c) c.textContent = "照片读不出来";
  });
}

function openViewer(date, pid){
  phByDate(date).then(function(list){
    if(!list.length) return;
    PV.list = list;
    PV.i = 0;
    for(var i=0;i<list.length;i++){ if(list[i].id === pid){ PV.i = i; break; } }
    document.getElementById("photoView").classList.add("on");
    showPV();
  });
}
function showPV(){
  var p = PV.list[PV.i]; if(!p) return;
  PV.urls.forEach(function(u){ try{ URL.revokeObjectURL(u); }catch(e){} });
  PV.urls = [];
  var u = URL.createObjectURL(p.full); PV.urls.push(u);
  document.getElementById("pvimg").src = u;
  document.getElementById("pvbar").textContent = (PV.i+1) + " / " + PV.list.length + " · " + p.date;
  document.getElementById("pvprev").disabled = (PV.i === 0);
  document.getElementById("pvnext").disabled = (PV.i === PV.list.length - 1);
}
function closeViewer(){
  document.getElementById("photoView").classList.remove("on");
  document.getElementById("pvimg").src = "";
  PV.urls.forEach(function(u){ try{ URL.revokeObjectURL(u); }catch(e){} });
  PV.urls = [];
}
function bindPhotoView(){
  var v = document.getElementById("photoView");
  if(!v || v.__b) return;
  v.__b = 1;
  v.addEventListener("click", function(e){
    if(e.target.closest("[data-pvclose]")){ closeViewer(); return; }
    if(e.target.id === "pvprev"){ if(PV.i > 0){ PV.i--; showPV(); } return; }
    if(e.target.id === "pvnext"){ if(PV.i < PV.list.length-1){ PV.i++; showPV(); } return; }
    if(e.target.closest("[data-pvdel]")){
      var p = PV.list[PV.i]; if(!p) return;
      if(!confirm("删掉这张照片？")) return;
      phDel(p.id).then(function(){ closeViewer(); paintPhotos(p.date); });
    }
  });
  var x0 = null;
  v.addEventListener("touchstart", function(e){ x0 = e.touches[0].clientX; }, {passive:true});
  v.addEventListener("touchend", function(e){
    if(x0 === null) return;
    var dx = e.changedTouches[0].clientX - x0;
    x0 = null;
    if(Math.abs(dx) < 40) return;
    if(dx < 0 && PV.i < PV.list.length-1){ PV.i++; showPV(); }
    else if(dx > 0 && PV.i > 0){ PV.i--; showPV(); }
  }, {passive:true});
}

function initSplash(){

  function flip(){
    if(done) return;
    done = true;
    sp.classList.add("turn");
    setTimeout(function(){ sp.style.display = "none"; }, 960);
  }
  sp.addEventListener("click", flip);
  var sy = null;
  sp.addEventListener("touchstart", function(e){ sy = e.touches[0].clientY; }, {passive:true});
  sp.addEventListener("touchend", function(e){
    if(sy!=null && (sy - e.changedTouches[0].clientY) > 24) flip();
    sy = null;
  }, {passive:true});
  sp.addEventListener("wheel", function(e){ if(e.deltaY > 6) flip(); }, {passive:true});
  window.addEventListener("keydown", function(e){
    if(e.key==="ArrowUp" || e.key===" " || e.key==="Enter") flip();
  });

}

function importData(){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = ".json,application/json";
  inp.style.display = "none";
  document.body.appendChild(inp);
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if(!f){ inp.remove(); return; }
    var fr = new FileReader();
    fr.onload = function(){
      var p;
      try{ p = JSON.parse(String(fr.result)); }
      catch(e){ toast("这个文件读不出来，是不是选错了"); inp.remove(); return; }
      var nl = 0, nh = 0;
      if(p && p.loads){
        for(var k in p.loads){
          var v = p.loads[k];
          if(typeof v === "number" && isFinite(v)){ loads[k] = v; nl++; }
        }
        wr(LS_LOAD, loads);
      }
      if(p && p.history && p.history.length){
        var seen = {};
        his.forEach(function(h){ seen[(h.date||"") + "|" + h.day] = 1; });
        p.history.forEach(function(h){
          if(h && h.date && h.day && !seen[h.date + "|" + h.day]){ his.push(h); seen[h.date + "|" + h.day] = 1; nh++; }
        });
        his.sort(function(a,b){ return (a.date||"") < (b.date||"") ? -1 : 1; });
        wr(LS_HIS, his);
      }
      var nn = 0;
      if(p && p.notes){
        for(var k2 in p.notes){
          var v2 = p.notes[k2];
          if(typeof v2 === "string" && v2.trim() && !notes[k2]){ notes[k2] = v2; nn++; }
        }
        if(nn) wr(LS_NOTE, notes);
      }
      inp.remove();
      renderHome();
      toast("已导入 · 重量 " + nl + " 条 · 记录 " + nh + " 次 · 心得 " + nn + " 天");
    };
    fr.onerror = function(){ toast("读文件出错了"); inp.remove(); };
    fr.readAsText(f);
  };
  inp.click();
}

  $("#note").style.display="none";
  $("#set").style.display="none";
  box.style.display="block";
  document.body.classList.add("in-session");
  if(keepScroll) window.scrollTo(0, sc);

  box.onclick=function(e){
    var st=e.target.closest("[data-set]");
    if(st){ tapSet(parseInt(st.getAttribute("data-set"),10)); return; }
    var b=e.target.closest("[data-a]"); if(!b) return;
    var a=b.getAttribute("data-a");
    if(a==="back"){ saveSess(); closeRest(); dropAwake(); S.day=null; renderHome(); return; }
    if(a==="prev"){ if(S.i>0){ S.i--; saveSess(); renderSession(); } return; }
    if(a==="next"){ if(S.i<curItems().length-1){ S.i++; saveSess(); renderSession(); } return; }
    if(a==="finish"){ finishSession(); return; }
  };
  box.onchange=function(e){
    if(e.target.id==="winput"){
      loads[it.id]=e.target.value.trim();
      wr(LS_LOAD,loads);
      toast("已记住："+loads[it.id]);
    }
  };
}
function tapSet(i){
  if(!S.day) return;
  if(T.on){ toast("休息中，先把休息跳过"); return; }
  var it=curItems()[S.i];
  var done=S.done[it.id]||0;
  if(done>i){ S.done[it.id]=i; saveSess(); renderSession(); return; }
  S.done[it.id]=i+1;
  saveSess(); renderSession();
  if(i+1 < it.sets){ openRest(it.rest); }
  else {
    beep(1);
    if(S.i < curItems().length-1){ toast("这个动作完成，换下一个"); }
  }
}
function finishSession(){
  var total=totalSets(S.day), dn=dayDoneSets();
  var dt = S.date || todayStr();
  var merged = false;
  for(var i=0;i<his.length;i++){
    if(his[i].date===dt && his[i].day===S.day){
      his[i].sets = dn; his[i].total = total; his[i].ts = Date.now(); merged = true; break;
    }
  }
  if(!merged) his.push({ ts:Date.now(), date:dt, day:S.day, sets:dn, total:total });
  wr(LS_HIS,his);
  cycNext(S.day);
  clearSess(); closeRest(); dropAwake();

  var dayName = PLAN[S.day].name;
  var nxt = suggestDay().day;
  var box=$("#session");
  box.innerHTML =
      '<div style="padding:40px 8px;text-align:center">'
    +   '<div style="font-size:44px;margin-bottom:6px">✓</div>'
    +   '<h2>'+dn+' / '+total+' 组</h2>'
    +   '<div class="sub" style="margin:8px 0 6px">'+dayName+' · '+dt+(dt!==todayStr()?'（补录）':'')+'</div>'
    +   '<div class="tiny muted" style="margin:0 0 22px">'
    +     (nxt ? '下一次：'+PLAN[nxt].name : '今天已经练完一圈，休息吧') + '</div>'
    +   '<button class="btn-main" data-a="home" style="min-width:200px">回到首页</button>'
    + '</div>';
  box.onclick=function(e){ if(e.target.closest("[data-a=home]")){ S.day=null; S.date=null; renderHome(); } };
}

/* ================= 设置面板 ================= */
function openSheet(){
  $("#sheet").className="on";
  var btns = document.querySelectorAll("#seg-theme [data-th]");
  for(var i=0;i<btns.length;i++) btns[i].className = (btns[i].getAttribute("data-th")===cfg.theme) ? "act" : "";
  var fb = document.querySelectorAll("#seg-fit [data-fit]");
  for(var j=0;j<fb.length;j++) fb[j].className = (fb[j].getAttribute("data-fit")===cfg.fit) ? "act" : "";
  $("#r-bgblur").value = cfg.bgBlur;
  $("#r-veil").value = Math.round(cfg.veil*100);
  $("#r-glass").value = Math.round(cfg.glassA*100);
  $("#r-gblur").value = cfg.glassBlur;
}
function closeSheet(){ $("#sheet").className=""; }

function bindRange(id, key, scale){
  $(id).addEventListener("input", function(e){
    var v = Number(e.target.value);
    cfg[key] = scale ? v/scale : v;
    wr(LS_CFG, cfg);
    applyLook();
  });
}
bindRange("#r-bgblur", "bgBlur");
bindRange("#r-gblur", "glassBlur");
bindRange("#r-veil", "veil", 100);
bindRange("#r-glass", "glassA", 100);

$("#seg-theme").addEventListener("click", function(e){
  var b=e.target.closest("[data-th]"); if(!b) return;
  cfg.theme = b.getAttribute("data-th");
  wr(LS_CFG,cfg); applyTheme(); openSheet();
});
$("#seg-fit").addEventListener("click", function(e){
  var b=e.target.closest("[data-fit]"); if(!b) return;
  cfg.fit = b.getAttribute("data-fit");
  wr(LS_CFG,cfg); applyLook(); openSheet();
});
$("#btn-sheet-done").addEventListener("click", closeSheet);
$("#sheet").addEventListener("click", function(e){ if(e.target.id==="sheet") closeSheet(); });

$("#btn-bg").addEventListener("click", function(){ $("#filebg").click(); });
$("#btn-bgclear").addEventListener("click", function(){
  cfg.bg=""; wr(LS_CFG,cfg); applyLook(); toast("背景已清除");
});
$("#filebg").addEventListener("change", function(e){
  var f = e.target.files && e.target.files[0]; if(!f) return;
  var fr = new FileReader();
  fr.onload = function(){
    var img = new Image();
    img.onload = function(){
      try{
        var maxW = 1800;
        var sc = Math.min(1, maxW / img.width);
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * sc);
        c.height = Math.round(img.height * sc);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        var data = c.toDataURL("image/jpeg", 0.85);
        var old = cfg.bg;
        cfg.bg = data;
        if(!wr(LS_CFG,cfg)){ cfg.bg = old; toast("图片太大，换一张小一点的"); return; }
        applyLook(); closeSheet(); toast("背景已设置");
      }catch(err){ toast("这张图读不了，换一张"); }
    };
    img.onerror = function(){ toast("这张图读不了，换一张"); };
    img.src = fr.result;
  };
  fr.readAsDataURL(f);
  e.target.value = "";
});

/* ================= 启动 ================= */
if(window.matchMedia){
  try{
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function(){
      if(cfg.theme==="auto") applyTheme();
    });
  }catch(e){}
}
document.addEventListener("visibilitychange", function(){
  if(document.visibilityState==="visible" && S.day) keepAwake();
});

applyTheme();
applyLook();

/* 开屏：翻页后才进主界面；如果上次训练没结束，直接进（别挡着继续练） */
(function boot(){
  var sp = $("#splash");
  var sess = readSess();
  if(sp && !sess){ initSplash(); }
  else if(sp){ sp.style.display = "none"; }
  bindTabbar();
  bindPhotoView();
  if(sess){ TAB = "fit"; renderApp(); }
  else { renderApp(); }
})();
</script>
